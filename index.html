<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purple Maze</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #0e0020;
        overflow: hidden;
        font-family: 'Courier New', Courier, monospace;
        color: #e0e0e0;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* ── UI Layer ── */
      #ui-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      /* ── Shared overlay backdrop ── */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 0, 20, 0.80);
        pointer-events: all;
        backdrop-filter: blur(2px);
      }

      .card {
        background: linear-gradient(160deg, #120026 0%, #0a0018 100%);
        border: 2px solid #990ae3;
        border-radius: 16px;
        padding: 36px 40px;
        max-width: 520px;
        width: 90vw;
        box-shadow: 0 0 60px rgba(153, 10, 227, 0.45), 0 0 20px rgba(153, 10, 227, 0.2) inset;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card h1 {
        text-align: center;
        color: #dd44ff;
        font-size: 2rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-shadow: 0 0 20px #990ae3, 0 0 40px #990ae3;
      }

      .card h2 {
        color: #dd44ff;
        font-size: 1.1rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .card p, .card label {
        font-size: 0.9rem;
        color: #a0a8c0;
        line-height: 1.6;
      }

      .cipher-label {
        font-size: 0.78rem;
        color: #ffd700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .ciphertext {
        background: #0a0018;
        border: 1px solid #440066;
        border-radius: 8px;
        padding: 14px 18px;
        font-size: 1.4rem;
        letter-spacing: 4px;
        color: #ffe000;
        text-align: center;
        word-break: break-all;
        font-family: 'Courier New', Courier, monospace;
        text-shadow: 0 0 12px #ffaa00;
      }

      .hint-box {
        background: #1a0030;
        border: 1px solid #990ae3;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 0.85rem;
        color: #dd44ff;
        white-space: pre-wrap;
      }

      .input-row {
        display: flex;
        gap: 8px;
      }

      .input-row input {
        flex: 1;
        background: #0a0018;
        border: 2px solid #440066;
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 1.1rem;
        color: #ffe000;
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: 2px;
        outline: none;
        transition: border-color 0.2s;
      }

      .input-row input:focus { border-color: #990ae3; box-shadow: 0 0 10px rgba(153,10,227,0.4); }

      button {
        background: linear-gradient(135deg, #990ae3 0%, #6600aa 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: 1px;
        cursor: pointer;
        transition: filter 0.15s, transform 0.1s;
        text-transform: uppercase;
        box-shadow: 0 0 16px rgba(153,10,227,0.4);
      }

      button:hover { filter: brightness(1.25); }
      button:active { transform: scale(0.97); }

      button.secondary {
        background: #0e0020;
        border: 1.5px solid #990ae3;
        color: #dd44ff;
        box-shadow: none;
      }
      button.secondary:hover { background: #1a0030; }

      button.big {
        padding: 14px 32px;
        font-size: 1rem;
        letter-spacing: 2px;
      }

      .btn-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .status-msg {
        min-height: 1.4em;
        font-size: 0.88rem;
        text-align: center;
        font-weight: bold;
      }
      .status-msg.error   { color: #ff4466; }
      .status-msg.success { color: #4ecca3; }
      .status-msg.locked  { color: #ffe000; }

      .lives-row {
        display: flex;
        gap: 8px;
        justify-content: center;
        font-size: 1.3rem;
      }

      .score-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      .score-table td {
        padding: 4px 8px;
        color: #a0a8c0;
      }
      .score-table td:last-child {
        text-align: right;
        color: #dd44ff;
        font-weight: bold;
      }

      /* ── Shake animation for wrong answer ── */
      @keyframes shake {
        0%,100% { transform: translateX(0); }
        20%      { transform: translateX(-8px); }
        40%      { transform: translateX(8px); }
        60%      { transform: translateX(-6px); }
        80%      { transform: translateX(6px); }
      }
      .shake { animation: shake 0.35s ease; }

      /* ── Keypress hint ── */
      #key-hint {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.75rem;
        color: #404060;
        letter-spacing: 1px;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/hackathon-puzzle/assets/index-DrXnXxLE.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui-layer"></div>
  </body>
</html>
